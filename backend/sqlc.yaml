# sqlc configuration: type-safe, generated query code.
#
#   make sqlc      # or: sqlc generate (inside backend/)
#
# Stage 1 ships no queries yet; as soon as *.sql query files appear in
# backend/internal/repositories/queries they are generated into
# backend/internal/repositories/sqlc with database types overridden to the
# domain-friendly ones below (money stays NUMERIC/pgtype.Numeric, never float).
version: "2"
sql:
  - engine: postgresql
    schema: ["migrations"]
    queries: ["internal/repositories/queries"]
    gen:
      go:
        package: sqlcgen
        out: "internal/repositories/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "pg_catalog.numeric"
            go_type: "string"
            pointer: true
