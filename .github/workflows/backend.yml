name: backend

on:
  push:
    branches: [main, "arena/**"]
    paths: ["backend/**", ".github/workflows/backend.yml", "Makefile"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", "Makefile"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, vet, unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: channelhunter
          POSTGRES_PASSWORD: channelhunter
          POSTGRES_DB: channelhunter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U channelhunter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://channelhunter:channelhunter@localhost:5432/channelhunter_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Unit tests (race detector)
        run: make test-race

      - name: Integration + e2e tests
        run: make test-integration

      - name: Build binaries
        run: make build

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        target: [api, bot, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            TARGET=${{ matrix.target }}
            VERSION=${{ github.sha }}
          push: false
