# ChannelHunter reverse proxy.
#
# Terminates TLS, forwards /api to the API service and / to the Mini App (later
# stage). Used in production in front of deploy/docker-compose.yml.
#
# Enable with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Certificates: mount them at /etc/nginx/certs (fullchain.pem + privkey.pem) or
# terminate TLS at your cloud load balancer and keep only the :80 block.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Never log the Telegram initData query string or auth headers.
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request_method $uri",'
        '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"request_id":"$http_x_request_id","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 12m;   # CSV/XLSX imports (MAX_UPLOAD_BYTES + overhead)

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 1024;

    # Basic protection for the auth endpoint.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    upstream channelhunter_api {
        server api:8080;
        keepalive 32;
    }

    # --- HTTP: redirect to HTTPS, except the health check ---------------------
    server {
        listen 80;
        server_name _;

        location = /health {
            proxy_pass http://channelhunter_api/health;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS ---------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name channelhunter.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Health probes without rate limiting.
        location = /health { proxy_pass http://channelhunter_api/health; access_log off; }
        location = /ready  { proxy_pass http://channelhunter_api/ready;  access_log off; }

        # Telegram webhook (only if the bot runs in webhook mode on the API).
        location = /telegram/webhook {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://channelhunter_api;
            include /etc/nginx/proxy_params.conf;
        }

        # Authentication is the most brute-forceable endpoint.
        location = /api/v1/auth/telegram {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://channelhunter_api;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://channelhunter_api;
            include /etc/nginx/proxy_params.conf;
        }

        # Mini App static build (stage 8+); JSON API stays above.
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
